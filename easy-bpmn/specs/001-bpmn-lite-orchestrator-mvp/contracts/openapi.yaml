openapi: 3.1.0
info:
  title: easy-bpmn BPMN-lite Orchestrator MVP API
  version: 0.1.0
  description: >
    Product-facing API for uploading BPMN-lite definitions, publishing immutable
    versions, starting process instances, publishing external messages, and
    inspecting process history.
servers:
  - url: http://localhost:8787
    description: Local Wrangler development server
paths:
  /definitions/drafts:
    post:
      summary: Upload BPMN XML as an editable draft
      operationId: createDefinitionDraft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDraftRequest"
      responses:
        "201":
          description: Draft created and validation attempted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Draft"
        "400":
          $ref: "#/components/responses/BadRequest"
  /definitions/drafts/{draftId}:
    get:
      summary: Inspect a BPMN draft and its validation status
      operationId: getDefinitionDraft
      parameters:
        - $ref: "#/components/parameters/DraftId"
      responses:
        "200":
          description: Draft details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Draft"
        "404":
          $ref: "#/components/responses/NotFound"
  /definitions/drafts/{draftId}/publish:
    post:
      summary: Publish a valid draft as an immutable executable version
      operationId: publishDefinitionDraft
      parameters:
        - $ref: "#/components/parameters/DraftId"
      responses:
        "201":
          description: Immutable version created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DefinitionVersion"
        "409":
          description: Draft contains publish-blocking validation issues
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishRejected"
        "404":
          $ref: "#/components/responses/NotFound"
  /definitions/versions/{definitionVersionId}:
    get:
      summary: Inspect an immutable published definition version
      operationId: getDefinitionVersion
      parameters:
        - $ref: "#/components/parameters/DefinitionVersionId"
      responses:
        "200":
          description: Published version details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DefinitionVersion"
        "404":
          $ref: "#/components/responses/NotFound"
  /definitions/versions/{definitionVersionId}/instances:
    post:
      summary: Start a process instance from a published definition version
      operationId: startProcessInstance
      parameters:
        - $ref: "#/components/parameters/DefinitionVersionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartInstanceRequest"
      responses:
        "201":
          description: Process instance started and bound to a Workflow instance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessInstance"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Instance could not be started from this version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /instances/{instanceId}:
    get:
      summary: Inspect process instance status, current element, variables, and diagnostics
      operationId: getProcessInstance
      parameters:
        - $ref: "#/components/parameters/InstanceId"
      responses:
        "200":
          description: Process instance inspection view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessInstanceInspection"
        "404":
          $ref: "#/components/responses/NotFound"
  /instances/{instanceId}/history:
    get:
      summary: Inspect business timeline and technical diagnostic history
      operationId: getProcessInstanceHistory
      parameters:
        - $ref: "#/components/parameters/InstanceId"
      responses:
        "200":
          description: History events
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/HistoryEvent"
        "404":
          $ref: "#/components/responses/NotFound"
  /messages:
    post:
      summary: Publish an external business message for Receive Task correlation
      operationId: publishMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishMessageRequest"
      responses:
        "202":
          description: Message accepted as correlated, buffered, or duplicate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishMessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Message rejected because correlation would violate MVP invariants
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishMessageResponse"
  /messages/{externalMessageId}:
    get:
      summary: Inspect an accepted external message and its final outcome
      operationId: getMessage
      parameters:
        - name: externalMessageId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Message details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalMessage"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  parameters:
    DraftId:
      name: draftId
      in: path
      required: true
      schema:
        type: string
    DefinitionVersionId:
      name: definitionVersionId
      in: path
      required: true
      schema:
        type: string
    InstanceId:
      name: instanceId
      in: path
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    CreateDraftRequest:
      type: object
      required: [workspaceId, name, bpmnXml]
      properties:
        workspaceId:
          type: string
        name:
          type: string
        bpmnXml:
          type: string
    Draft:
      type: object
      required: [draftId, workspaceId, name, status, validationIssues, createdAt, updatedAt]
      properties:
        draftId:
          type: string
        workspaceId:
          type: string
        name:
          type: string
        status:
          enum: [draft, valid, invalid]
        validationIssues:
          type: array
          items:
            $ref: "#/components/schemas/ValidationIssue"
        latestPublishedVersionId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ValidationIssue:
      type: object
      required: [severity, elementName, reason]
      properties:
        severity:
          enum: [error, warning]
        elementId:
          type: string
          nullable: true
        elementName:
          type: string
        location:
          type: string
          nullable: true
        reason:
          type: string
    DefinitionVersion:
      type: object
      required:
        - definitionVersionId
        - draftId
        - workspaceId
        - versionNumber
        - status
        - bpmnXmlHash
        - elements
        - publishedAt
      properties:
        definitionVersionId:
          type: string
        draftId:
          type: string
        workspaceId:
          type: string
        versionNumber:
          type: integer
          minimum: 1
        status:
          const: published
        bpmnXmlHash:
          type: string
        elements:
          type: array
          items:
            $ref: "#/components/schemas/BpmnElement"
        publishedAt:
          type: string
          format: date-time
    BpmnElement:
      type: object
      required: [elementId, type]
      properties:
        elementId:
          type: string
          description: >
            BPMN XML id. Used for audit and inspection only; never the worker routing
            key (tool-generated ids change when an element is re-drawn).
        type:
          enum: [startEvent, serviceTask, receiveTask, endEvent, sequenceFlow, message]
        name:
          type: string
          nullable: true
        taskType:
          type: string
          nullable: true
          description: >
            Service Task worker routing key, read from <extensionElements> under the
            easy-bpmn namespace. Stable and author-defined; this is the worker handle,
            not elementId or name.
        messageName:
          type: string
          nullable: true
          description: Receive Task / message — resolved name of the referenced <message>.
    StartInstanceRequest:
      type: object
      required: [workspaceId, correlationKey, variables]
      properties:
        workspaceId:
          type: string
        businessKey:
          type: string
          nullable: true
        correlationKey:
          type: string
          description: >
            Correlation key for this instance's Receive Task subscriptions. Supplied
            via the API in the MVP (not derived from a model-level subscription
            expression).
        variables:
          type: object
          additionalProperties: true
        idempotencyKey:
          type: string
          nullable: true
    ProcessInstance:
      type: object
      required:
        - instanceId
        - workspaceId
        - definitionVersionId
        - workflowInstanceId
        - correlationKey
        - status
        - currentElementId
        - variables
        - startedAt
      properties:
        instanceId:
          type: string
        workspaceId:
          type: string
        definitionVersionId:
          type: string
        workflowInstanceId:
          type: string
        businessKey:
          type: string
          nullable: true
        correlationKey:
          type: string
        status:
          enum: [starting, running, waiting, completed, incident]
        currentElementId:
          type: string
          nullable: true
        variables:
          type: object
          additionalProperties: true
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
    ProcessInstanceInspection:
      allOf:
        - $ref: "#/components/schemas/ProcessInstance"
        - type: object
          required: [historySummary, diagnostics]
          properties:
            historySummary:
              type: array
              items:
                $ref: "#/components/schemas/HistoryEvent"
            diagnostics:
              type: object
              additionalProperties: true
            incident:
              $ref: "#/components/schemas/Incident"
              nullable: true
    PublishMessageRequest:
      type: object
      required: [workspaceId, messageName, correlationKey, messageId, payload]
      properties:
        workspaceId:
          type: string
        messageName:
          type: string
        correlationKey:
          type: string
        messageId:
          type: string
        payload:
          type: object
          additionalProperties: true
    PublishMessageResponse:
      type: object
      required: [outcome, messageName, correlationKey, messageId, externalMessageId]
      properties:
        outcome:
          enum: [correlated, buffered, duplicate, rejected]
        messageName:
          type: string
        correlationKey:
          type: string
        messageId:
          type: string
        externalMessageId:
          type: string
        instanceId:
          type: string
          nullable: true
        duplicateOf:
          type: string
          nullable: true
        reason:
          type: string
          nullable: true
    ExternalMessage:
      allOf:
        - $ref: "#/components/schemas/PublishMessageResponse"
        - type: object
          required: [receivedAt]
          properties:
            finalOutcome:
              enum: [correlated, buffered, duplicate, expired, late, rejected, invariantViolation]
            receivedAt:
              type: string
              format: date-time
            correlatedAt:
              type: string
              format: date-time
              nullable: true
            expiresAt:
              type: string
              format: date-time
              nullable: true
    HistoryEvent:
      type: object
      required: [historyEventId, type, businessTime, technicalTime]
      properties:
        historyEventId:
          type: string
        type:
          type: string
        instanceId:
          type: string
          nullable: true
        elementId:
          type: string
          nullable: true
        externalMessageId:
          type: string
          nullable: true
        businessTime:
          type: string
          format: date-time
        technicalTime:
          type: string
          format: date-time
        payloadSnapshot:
          type: object
          additionalProperties: true
          nullable: true
        diagnostics:
          type: object
          additionalProperties: true
    Incident:
      type: object
      required: [incidentId, instanceId, elementId, reason, status, createdAt]
      properties:
        incidentId:
          type: string
        instanceId:
          type: string
        elementId:
          type: string
        reason:
          type: string
        status:
          const: open
        retryCount:
          type: integer
        payloadContext:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
    PublishRejected:
      type: object
      required: [error, validationIssues]
      properties:
        error:
          type: string
        validationIssues:
          type: array
          items:
            $ref: "#/components/schemas/ValidationIssue"
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
        details:
          type: object
          additionalProperties: true
