name: Deploy

# Push to main → run the full test gate, then apply D1 migrations and deploy the
# Worker (CorrelationBroker DO + easy-bpmn-process Workflow) to bpmn.rntme.com.
# The project lives in the easy-bpmn/ subdirectory of this repo.
#
# Deploy steps are skipped gracefully until CLOUDFLARE_API_TOKEN is configured,
# so the pipeline is green from the first push. `workflow_dispatch` lets you run
# a manual deploy from the Actions tab once the secret is set.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: easy-bpmn
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: easy-bpmn/package-lock.json
      - run: npm ci

      # Test gate — deploy only runs if these pass.
      - name: Typecheck
        run: npm run typecheck
      - name: Test (unit + contract + integration)
        run: npm test

      - name: Missing Cloudflare token notice
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: |
          echo "::warning::CLOUDFLARE_API_TOKEN is not set — skipping migrations + deploy."
          echo "Add the CLOUDFLARE_API_TOKEN repo secret to enable continuous deployment."

      - name: Apply D1 migrations (remote, idempotent)
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: npx wrangler d1 migrations apply easy_bpmn --remote

      - name: Deploy Worker
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: npx wrangler deploy
