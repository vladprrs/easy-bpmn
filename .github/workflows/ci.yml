name: CI

# Typecheck + full test suite (Vitest workers pool) + offline build validation.
# Continuous deployment is handled by Cloudflare Workers Builds (native auth, on
# push to main), so GitHub Actions runs tests only — no Cloudflare secrets needed.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test (unit + contract + integration)
        run: npm test
      - name: Build validation (wrangler dry-run — offline, no deploy)
        run: npx wrangler deploy --dry-run
