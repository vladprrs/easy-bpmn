name: CI

# Typecheck + full test suite (Vitest workers pool) + offline build validation.
# The project lives in the easy-bpmn/ subdirectory of this repo. No secrets needed.
on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: easy-bpmn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: easy-bpmn/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test (unit + contract + integration)
        run: npm test
      - name: Build validation (wrangler dry-run — offline, no deploy)
        run: npx wrangler deploy --dry-run
