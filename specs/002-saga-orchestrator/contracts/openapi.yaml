openapi: 3.1.0
info:
  title: easy-bpmn SAGA Orchestrator API (M1 — Canonical transaction-saga)
  version: 0.3.0
  description: >
    Product-facing API for the canonical-BPMN transaction-saga orchestrator. Retains the
    MVP surface (drafts, immutable versions, instances, external messages, history) and
    adds the pull / external-task worker contract (activate/complete/fail), operator verbs
    (cancel/retry/list), and the saga inspection block. Every /jobs/* call carries a
    per-workspace worker credential; the server derives workspaceId from the credential and
    never trusts a body workspaceId for job access. The API does not leak Cloudflare
    Workflow internals (no workflowInstanceId is required from worker or operator callers).
    The M-UI operator-console endpoints (read/aggregation/auth: /ui/login, /ui/logout,
    /ui/me, /projects, /attention, /sagas, the saga heatmap, GET /messages, instance jobs,
    raw BPMN, and an SSE history live-tail) were added in lockstep with constitution v2.4.0.
    The session-gated
    ones carry an `operatorSession` cookie; all of them read D1 only (the inspection invariant
    is preserved).
servers:
  - url: http://localhost:8787
    description: Local Wrangler development server
paths:
  /definitions/drafts:
    post:
      summary: Upload BPMN XML as an editable draft
      operationId: createDefinitionDraft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDraftRequest"
      responses:
        "201":
          description: Draft created and validation attempted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Draft"
        "400":
          $ref: "#/components/responses/BadRequest"
  /definitions/drafts/{draftId}:
    get:
      summary: Inspect a BPMN draft and its validation status
      operationId: getDefinitionDraft
      parameters:
        - $ref: "#/components/parameters/DraftId"
      responses:
        "200":
          description: Draft details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Draft"
        "404":
          $ref: "#/components/responses/NotFound"
  /definitions/drafts/{draftId}/publish:
    post:
      summary: Publish a valid draft as an immutable executable version
      operationId: publishDefinitionDraft
      parameters:
        - $ref: "#/components/parameters/DraftId"
      responses:
        "201":
          description: Immutable version created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DefinitionVersion"
        "409":
          description: Draft contains publish-blocking validation issues
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishRejected"
        "404":
          $ref: "#/components/responses/NotFound"
  /definitions/versions/{definitionVersionId}:
    get:
      summary: Inspect an immutable published definition version
      operationId: getDefinitionVersion
      parameters:
        - $ref: "#/components/parameters/DefinitionVersionId"
      responses:
        "200":
          description: Published version details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DefinitionVersion"
        "404":
          $ref: "#/components/responses/NotFound"
  /definitions/versions/{definitionVersionId}/instances:
    post:
      summary: Start a process instance from a published definition version
      operationId: startProcessInstance
      parameters:
        - $ref: "#/components/parameters/DefinitionVersionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartInstanceRequest"
      responses:
        "201":
          description: Process instance started and bound to a Workflow instance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessInstance"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Instance could not be started from this version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /instances:
    get:
      summary: List process instances (filter by workspace and status; cursor-paged)
      operationId: listProcessInstances
      description: >
        Operator discovery for stuck/compensating/compensationFailed/incident sagas. Backed
        by the (workspace_id, status) index.
      parameters:
        - name: workspaceId
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: >
            Accepts a single status OR a comma-separated list (multi-status filter), e.g.
            `incident,compensationFailed`. Each value is an InstanceStatus.
          schema:
            $ref: "#/components/schemas/InstanceStatus"
        - name: search
          in: query
          required: false
          description: Free-text filter over businessKey / correlationKey / instanceId (M-UI).
          schema:
            type: string
        - name: sagaId
          in: query
          required: false
          description: Restrict to instances of one saga (draft_id) across all its versions (M-UI).
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: A page of process instances
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceList"
        "400":
          $ref: "#/components/responses/BadRequest"
  /instances/{instanceId}:
    get:
      summary: Inspect instance status, current element, variables, diagnostics, and saga view
      operationId: getProcessInstance
      parameters:
        - $ref: "#/components/parameters/InstanceId"
      responses:
        "200":
          description: Process instance inspection view (includes the saga block)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessInstanceInspection"
        "404":
          $ref: "#/components/responses/NotFound"
  /instances/{instanceId}/history:
    get:
      summary: Inspect business timeline and technical diagnostic history
      operationId: getProcessInstanceHistory
      description: >
        Also the SSE poll fallback (M-UI): pass `since=<rowid cursor>` to tail only events
        newer than the cursor (the GET /instances/{id}/stream reconnect path).
      parameters:
        - $ref: "#/components/parameters/InstanceId"
        - name: since
          in: query
          required: false
          description: Return only history events with rowid greater than this cursor (delta tail).
          schema:
            type: integer
      responses:
        "200":
          description: History events
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/HistoryEvent"
                  nextCursor:
                    type: integer
                    nullable: true
                    description: The highest rowid in this page; null when there are no events.
        "404":
          $ref: "#/components/responses/NotFound"
  /instances/{instanceId}/cancel:
    post:
      summary: Operator-triggered transaction cancellation (initiates reverse-order compensation)
      operationId: cancelProcessInstance
      description: >
        Status-conditional: only the first call on a running/waiting instance initiates one
        reverse pass. An instance with an empty saga ledger goes straight to cancelled
        (nothing to compensate).
      parameters:
        - $ref: "#/components/parameters/InstanceId"
      responses:
        "202":
          description: Cancellation accepted; instance is compensating or cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessInstance"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Instance is not in a cancellable state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /instances/{instanceId}/retry:
    post:
      summary: Retry a failed forward step (incident) or resume a compensationFailed reverse pass
      operationId: retryProcessInstance
      description: >
        Status-conditional; resets the existing job row rather than inserting. The single
        resumable transition is compensationFailed -> compensating.
      parameters:
        - $ref: "#/components/parameters/InstanceId"
      responses:
        "202":
          description: Retry accepted; instance resumed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessInstance"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Instance is not in a retryable state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /jobs/activate:
    post:
      summary: Lease pull-worker jobs by taskType (bounded long-poll)
      operationId: activateJobs
      security:
        - workerCredential: []
      description: >
        The server derives workspaceId from the worker credential and rejects taskType claims
        outside that workspace; a body workspaceId is never trusted for job access. Atomic
        IN-subquery lease (D1 does not parse UPDATE...LIMIT...RETURNING).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivateJobsRequest"
      responses:
        "200":
          description: Zero or more leased jobs (forward and/or compensation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivateJobsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /jobs/{jobId}/complete:
    post:
      summary: Complete a leased job with output variables
      operationId: completeJob
      security:
        - workerCredential: []
      description: >
        lock_token-conditional. A stale/duplicate worker matches zero rows (rejected or stable
        prior outcome). If the instance is terminal/not-running, returns a 200 no-op ack rather
        than a 500. Output is payload-limit checked before event delivery.
      parameters:
        - $ref: "#/components/parameters/JobId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteJobRequest"
      responses:
        "200":
          description: Completion acknowledged (advanced, duplicate stable outcome, or terminal no-op)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobCallbackResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Stale or invalid lock token (matched zero rows)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobCallbackResponse"
        "413":
          description: Output payload exceeds the Workflows event limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /jobs/{jobId}/fail:
    post:
      summary: Fail a leased job (technical retry-via-release, or business error -> cancel)
      operationId: failJob
      security:
        - workerCredential: []
      description: >
        lock_token-conditional and idempotent via the workerCallback record (a duplicate fail
        returns the prior outcome and does not re-count an attempt). No errorCode = a technical
        failure (re-lease until the retry budget is exhausted); an errorCode matching a model
        bpmn:error/@errorCode raises that BPMN error -> error boundary -> cancel. The `retryable`
        field is HONORED (M3): omitted/true = normal backoff retry; false = immediate exhaustion
        (skip remaining technical retries) -> the standard exhaustion path (a Hazard incident
        inside a transaction). BEHAVIOR CHANGE (M3): a worker already sending `retryable=false`
        (legal and IGNORED before M3) now short-circuits its retries instead of being re-leased.
      parameters:
        - $ref: "#/components/parameters/JobId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FailJobRequest"
      responses:
        "200":
          description: Failure acknowledged (retry scheduled, business error raised, or terminal no-op)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobCallbackResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Stale or invalid lock token (matched zero rows)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobCallbackResponse"
  /messages:
    post:
      summary: Publish an external business message for Receive Task correlation
      operationId: publishMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishMessageRequest"
      responses:
        "202":
          description: Message accepted as correlated, buffered, or duplicate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishMessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Message rejected because correlation would violate invariants
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishMessageResponse"
    get:
      summary: Search accepted external messages (operator console)
      operationId: searchMessages
      security:
        - operatorSession: []
      description: >
        Cursor-paged external-message search for the operator console. `workspaceId` falls
        back to UI_DEFAULT_WORKSPACE when omitted; `messageName`, `correlationKey`, and
        `outcome` narrow the result. Reads D1 only.
      parameters:
        - name: workspaceId
          in: query
          required: false
          schema:
            type: string
        - name: messageName
          in: query
          required: false
          schema:
            type: string
        - name: correlationKey
          in: query
          required: false
          schema:
            type: string
        - name: outcome
          in: query
          required: false
          schema:
            type: string
        - name: cursor
          in: query
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: A page of matched external messages
          content:
            application/json:
              schema:
                type: object
                required: [messages]
                properties:
                  messages:
                    type: array
                    items:
                      $ref: "#/components/schemas/MessageSearchItem"
                  nextCursor:
                    type: integer
                    nullable: true
        "401":
          $ref: "#/components/responses/Unauthorized"
  /messages/{externalMessageId}:
    get:
      summary: Inspect an accepted external message and its final outcome
      operationId: getMessage
      parameters:
        - name: externalMessageId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Message details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalMessage"
        "404":
          $ref: "#/components/responses/NotFound"
  /ui/login:
    post:
      summary: Authenticate an operator and open a console session
      operationId: uiLogin
      description: >
        Validates operator credentials; on success sets the `ebpmn_session` cookie
        (HMAC-signed, HttpOnly + Secure + SameSite=Lax) that gates the UI-namespace
        endpoints, via Set-Cookie. Not session-gated. Returns 400 when console auth is
        unconfigured, 401 on bad credentials.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated; the `ebpmn_session` session cookie is set via Set-Cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /ui/logout:
    post:
      summary: Clear the operator console session
      operationId: uiLogout
      description: Clears the `ebpmn_session` cookie (expired via Set-Cookie). Not session-gated.
      responses:
        "204":
          description: Session cleared; the `ebpmn_session` cookie is expired via Set-Cookie
  /ui/me:
    get:
      summary: Report console session + auth-configuration status
      operationId: uiMe
      description: >
        SPA boot probe. Not session-gated. Reports whether the caller holds a valid session,
        the default workspace for boot, and whether console auth is configured.
      responses:
        "200":
          description: Session and auth-configuration status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
  /projects:
    get:
      summary: List project (workspace) rollups for the operator console
      operationId: listProjects
      security:
        - operatorSession: []
      description: Per-workspace saga + instance-status rollups with an attention count. Reads D1 only.
      responses:
        "200":
          description: Project rollups
          content:
            application/json:
              schema:
                type: object
                required: [projects]
                properties:
                  projects:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProjectRollup"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /attention:
    get:
      summary: Cross-saga attention set (incident / compensationFailed / stale compensating)
      operationId: listAttention
      security:
        - operatorSession: []
      description: >
        Instances needing operator attention across one project. `projectId` falls back to
        UI_DEFAULT_WORKSPACE when omitted. "Stale compensating" = compensating with updated_at
        older than 5 minutes (NOT all compensating). Reads D1 only.
      parameters:
        - name: projectId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Attention items
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AttentionItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /sagas:
    get:
      summary: List sagas (definition drafts) with version + instance-status rollups
      operationId: listSagas
      security:
        - operatorSession: []
      description: >
        One row per saga (draft_id) with its active version, version count, transaction flag,
        and instance-status counts. `projectId` falls back to UI_DEFAULT_WORKSPACE. Reads D1 only.
      parameters:
        - name: projectId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Saga summaries
          content:
            application/json:
              schema:
                type: object
                required: [sagas]
                properties:
                  sagas:
                    type: array
                    items:
                      $ref: "#/components/schemas/SagaSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /sagas/{sagaId}:
    get:
      summary: Inspect one saga and its published versions
      operationId: getSaga
      security:
        - operatorSession: []
      parameters:
        - $ref: "#/components/parameters/SagaId"
      responses:
        "200":
          description: Saga detail with per-version instance counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SagaDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /sagas/{sagaId}/heatmap:
    get:
      summary: Per-element live-instance density (the aggregate "living heatmap")
      operationId: getSagaHeatmap
      security:
        - operatorSession: []
      description: >
        Live instances for one saga (draft_id) grouped by current_element_id + status,
        powering the aggregate living-heatmap mode. Only "placed" instances are counted
        (current_element_id set AND a non-terminal status); terminal instances are excluded.
        Reads D1 only.
      parameters:
        - $ref: "#/components/parameters/SagaId"
      responses:
        "200":
          description: Per-node live-instance density for the saga
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SagaHeatmap"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /instances/{instanceId}/jobs:
    get:
      summary: List an instance's service-task jobs with worker-attempt drill-down
      operationId: getInstanceJobs
      security:
        - operatorSession: []
      description: >
        Forward and compensation jobs for one instance, each with its worker_attempts
        (request/response/error per attempt). Reads D1 only.
      parameters:
        - $ref: "#/components/parameters/InstanceId"
      responses:
        "200":
          description: Instance jobs with attempts
          content:
            application/json:
              schema:
                type: object
                required: [jobs]
                properties:
                  jobs:
                    type: array
                    items:
                      $ref: "#/components/schemas/InstanceJobView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /definitions/versions/{definitionVersionId}/bpmn:
    get:
      summary: Fetch the raw BPMN XML for a published version (diagram render source)
      operationId: getDefinitionVersionBpmn
      security:
        - operatorSession: []
      parameters:
        - $ref: "#/components/parameters/DefinitionVersionId"
      responses:
        "200":
          description: Raw BPMN XML and its content hash
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BpmnXmlResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /instances/{instanceId}/stream:
    get:
      summary: Live-tail an instance's history via Server-Sent Events
      operationId: streamInstance
      security:
        - operatorSession: []
      description: >
        Server-Sent Events live-tail of this instance's history_events, keyed by rowid. Each
        event carries `id:<cursor>`; the stream honors the Last-Event-ID request header to
        resume after a gap. Bounded to ~25s, after which the client reconnects (or falls back
        to GET /instances/{id}/history?since=<cursor>). Reads D1 only; never Workflow state.
      parameters:
        - $ref: "#/components/parameters/InstanceId"
      responses:
        "200":
          description: >
            An SSE stream (text/event-stream) of history-event deltas; each carries an
            `id:<rowid cursor>`. The connection closes after ~25s and the client reconnects.
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    workerCredential:
      type: http
      scheme: bearer
      description: >
        Per-workspace worker credential. The server resolves it to a workspace and derives
        workspaceId from it; the request body never carries a trusted workspaceId for job
        access. A missing or revoked credential is rejected as unauthorized.
    operatorSession:
      type: apiKey
      in: cookie
      name: ebpmn_session
      description: >
        Operator-console session cookie (HMAC-signed, HttpOnly + Secure + SameSite=Lax),
        issued by POST /ui/login. Gates the M-UI read/aggregation endpoints. A missing,
        invalid, or expired session is rejected as unauthorized.
  parameters:
    DraftId:
      name: draftId
      in: path
      required: true
      schema:
        type: string
    DefinitionVersionId:
      name: definitionVersionId
      in: path
      required: true
      schema:
        type: string
    InstanceId:
      name: instanceId
      in: path
      required: true
      schema:
        type: string
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
    SagaId:
      name: sagaId
      in: path
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing, revoked, or invalid worker credential
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    InstanceStatus:
      type: string
      enum:
        - starting
        - running
        - waiting
        - completed
        - incident
        - compensating
        - compensated
        - compensationFailed
        - cancelled
    CreateDraftRequest:
      type: object
      required: [workspaceId, name, bpmnXml]
      properties:
        workspaceId:
          type: string
        name:
          type: string
        bpmnXml:
          type: string
    Draft:
      type: object
      required: [draftId, workspaceId, name, status, validationIssues, createdAt, updatedAt]
      properties:
        draftId:
          type: string
        workspaceId:
          type: string
        name:
          type: string
        status:
          enum: [draft, valid, invalid]
        validationIssues:
          type: array
          items:
            $ref: "#/components/schemas/ValidationIssue"
        latestPublishedVersionId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ValidationIssue:
      type: object
      required: [severity, elementName, reason]
      properties:
        severity:
          enum: [error, warning]
        elementId:
          type: string
          nullable: true
        elementName:
          type: string
        location:
          type: string
          nullable: true
        reason:
          type: string
    DefinitionVersion:
      type: object
      required:
        - definitionVersionId
        - draftId
        - workspaceId
        - versionNumber
        - status
        - bpmnXmlHash
        - elements
        - publishedAt
      properties:
        definitionVersionId:
          type: string
